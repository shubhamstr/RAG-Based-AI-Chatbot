services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    restart: unless-stopped
    ports:
      - "6002:6333" # Qdrant REST API & Web Dashboard mapped to http://localhost:6002
      - "6003:6334" # Qdrant gRPC API mapped to http://localhost:6003
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

volumes:
  qdrant_storage:
    name: qdrant_storage

