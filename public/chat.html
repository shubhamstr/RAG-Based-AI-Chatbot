<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG-Based AI Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            serif: ['"Instrument Serif"', 'Georgia', 'serif'],
          }
        }
      }
    };
  </script>
  <script>
    (function() {
      const theme = localStorage.getItem('rag_theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* Custom scrollbar for chat message thread */
    #chat-messages {
      scrollbar-width: thin;
      scrollbar-color: rgba(110, 133, 120, 0.3) transparent;
      scroll-behavior: smooth;
    }
    #chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    #chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-messages::-webkit-scrollbar-thumb {
      background: rgba(110, 133, 120, 0.25);
      border-radius: 9999px;
    }
    #chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(110, 133, 120, 0.45);
    }
  </style>
</head>
<body class="h-screen h-[100dvh] flex flex-col font-sans bg-[#f7faf8] text-[#111a14] dark:bg-[#07110c] dark:text-[#edf4ef] antialiased transition-colors duration-300 selection:bg-emerald-500/20 selection:text-emerald-500 dark:selection:text-emerald-400 overflow-hidden">
  
  <!-- Top Navigation Header -->
  <header class="w-full bg-[#f7faf8] dark:bg-[#07110c] border-b border-[#e5ece8] dark:border-[#13231a] transition-colors duration-300 shrink-0">
    <div class="w-full px-5 sm:px-8 h-16 flex items-center justify-between">
      <!-- Brand -->
      <a href="/" class="flex items-center gap-3 select-none group text-inherit no-underline">
        <div class="w-9 h-9 rounded-xl bg-emerald-100 dark:bg-[#143d2c] border border-emerald-300 dark:border-[#22573f] flex items-center justify-center text-emerald-700 dark:text-emerald-400 shadow-sm transition-transform duration-200 group-hover:scale-105">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <span class="font-serif text-xl sm:text-2xl font-normal tracking-wide text-[#111a14] dark:text-[#d3eae0]">
          RAG–Based AI Chatbot
        </span>
      </a>

      <!-- Theme Toggle Button -->
      <button id="theme-toggle" type="button" class="w-9 h-9 rounded-xl flex items-center justify-center text-[#5e6f65] dark:text-[#889e92] hover:text-[#111a14] dark:hover:text-[#edf4ef] hover:bg-[#e2e8e4]/50 dark:hover:bg-[#14231b] transition-all duration-200 cursor-pointer focus:outline-none" aria-label="Toggle color theme" title="Toggle theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg id="sun-icon" class="w-5 h-5 hidden dark:block transition-transform duration-300 hover:rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg id="moon-icon" class="w-5 h-5 block dark:hidden transition-transform duration-300 -rotate-12 hover:rotate-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Subheader Toolbar: File View Button & New Upload Button -->
  <div class="w-full border-b border-[#e5ece8] dark:border-[#13231a] bg-[#f7faf8] dark:bg-[#07110c] shrink-0">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between gap-4">
      <!-- File View Pill(s) Container -->
      <div id="file-pills-container" class="flex items-center gap-2 overflow-x-auto py-1 scrollbar-none">
        <!-- Rendered dynamically by chat.js -->
        <button 
          id="default-file-pill" 
          type="button" 
          class="file-view-btn inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-[#eef4f0] hover:bg-[#e2ebe5] dark:bg-[#101b15] dark:hover:bg-[#15231c] text-[#2b4235] dark:text-[#c4d8ce] border border-[#d2dfd7] dark:border-[#1f3427] transition-all duration-200 cursor-pointer shadow-sm group"
          title="Click to preview file"
        >
          <svg class="w-3.5 h-3.5 text-[#52705f] dark:text-[#7f988b] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="10" y1="9" x2="8" y2="9"/>
          </svg>
          <span class="file-name truncate max-w-[150px] sm:max-w-[210px]">Mercer Executive Summar...</span>
          <span class="file-view-icon-wrapper ml-0.5 text-[#52705f] dark:text-[#7f988b] group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors" title="View file">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- New Upload Action Button (Redirects to previous page) -->
      <button 
        id="new-upload-btn" 
        type="button" 
        class="inline-flex items-center gap-2 text-xs sm:text-sm font-medium text-[#2d4638] dark:text-[#c4d8ce] hover:text-emerald-600 dark:hover:text-white transition-colors cursor-pointer shrink-0 py-1 px-2 rounded-lg hover:bg-emerald-500/10 active:scale-95" 
        title="Upload new documents"
      >
        <svg class="w-4 h-4 shrink-0 text-[#4c6b5a] dark:text-[#8ea79a]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>New upload</span>
      </button>
    </div>
  </div>

  <!-- Chat Viewport & Messages Thread -->
  <main class="flex-1 min-h-0 relative flex flex-col w-full overflow-hidden">
    
    <!-- Empty State Indicator (Shown initially) -->
    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none p-4 pb-20 z-0">
      <p class="text-sm sm:text-base font-normal text-[#5a7063] dark:text-[#738a7d] tracking-tight select-none text-center">
        Ask a question about your PDFs.
      </p>
    </div>

    <!-- Scrollable Messages Container -->
    <div id="chat-messages" class="w-full max-w-3xl mx-auto flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-6 space-y-5 relative z-0 overscroll-contain">
      <!-- Dynamic chat bubbles will be appended here -->
    </div>

    <!-- Bottom Sticky Chat Option Container -->
    <div class="w-full shrink-0 sticky bottom-0 z-10 bg-[#f7faf8] dark:bg-[#07110c] border-t border-[#e5ece8] dark:border-[#13231a] transition-colors duration-300">
      <div class="max-w-3xl mx-auto px-4 sm:px-6 py-3 sm:py-4">
        <form id="chat-form" class="relative flex items-center w-full">
          <div class="w-full rounded-2xl bg-white dark:bg-[#0c1611] border border-[#d2dfd7] dark:border-[#1b3024] focus-within:border-emerald-500 dark:focus-within:border-emerald-500/80 focus-within:ring-2 focus-within:ring-emerald-500/20 shadow-sm transition-all duration-200 flex items-center px-3.5 sm:px-4 py-2 sm:py-2.5 gap-2">
            <input 
              type="text" 
              id="chat-input" 
              class="flex-1 bg-transparent text-sm sm:text-base text-[#111a14] dark:text-[#edf4ef] placeholder-[#6b8275] dark:placeholder-[#485c51] outline-none font-normal" 
              placeholder="Type your message..." 
              autocomplete="off"
              required
            />
            <button 
              type="submit" 
              id="send-btn" 
              class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white flex items-center justify-center transition-all duration-200 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed shrink-0 shadow-sm"
              aria-label="Send message"
              title="Send message"
            >
              <svg class="w-4 h-4 translate-x-[-1px] translate-y-[-0.5px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- PDF File Viewer Popup Modal with <iframe> -->
  <div 
    id="file-modal" 
    class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-file-title"
  >
    <div 
      id="file-modal-card" 
      class="w-full max-w-5xl h-[88vh] bg-[#fbfdfc] dark:bg-[#0c1712] border border-[#d0ded5] dark:border-[#1d3527] rounded-2xl shadow-2xl flex flex-col overflow-hidden transform scale-95 transition-transform duration-300"
    >
      <!-- Modal Header -->
      <div class="px-4 sm:px-6 py-3.5 bg-[#f0f6f2] dark:bg-[#112019] border-b border-[#d0ded5] dark:border-[#1d3527] flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-950/70 text-emerald-700 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800/60 flex items-center justify-center shrink-0">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
          <div class="min-w-0">
            <h2 id="modal-file-title" class="text-sm sm:text-base font-semibold text-[#111a14] dark:text-[#edf4ef] truncate">
              Document Preview
            </h2>
            <p id="modal-file-subtitle" class="text-xs text-[#52705f] dark:text-[#7f988b] truncate">
              PDF viewer
            </p>
          </div>
        </div>

        <!-- Multiple Files Selector (Tabs) if more than 1 file -->
        <div id="modal-file-tabs" class="hidden sm:flex items-center gap-1.5 max-w-md overflow-x-auto scrollbar-none px-2"></div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Open in new tab -->
          <a 
            id="modal-open-newtab" 
            href="#" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="p-2 rounded-lg text-[#52705f] dark:text-[#7f988b] hover:text-[#111a14] dark:hover:text-white hover:bg-emerald-500/10 transition-colors"
            title="Open in new browser tab"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>

          <!-- Close Modal Button -->
          <button 
            id="modal-close-btn" 
            type="button" 
            class="p-2 rounded-lg text-[#52705f] dark:text-[#7f988b] hover:text-red-500 dark:hover:text-red-400 hover:bg-red-500/10 transition-colors cursor-pointer" 
            title="Close preview"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Modal Body with iframe -->
      <div class="flex-1 relative bg-white dark:bg-[#121f18] overflow-hidden flex flex-col">
        <iframe 
          id="file-viewer-iframe" 
          src="about:blank" 
          class="w-full h-full border-0" 
          title="File preview iframe"
        ></iframe>
      </div>
    </div>
  </div>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
