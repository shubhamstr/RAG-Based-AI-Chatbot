<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG-Based AI Chatbot - Upload Documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            serif: ['"Instrument Serif"', 'Georgia', 'serif'],
          }
        }
      }
    };
  </script>
  <script>
    (function() {
      const theme = localStorage.getItem('rag_theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col font-sans bg-[#f7faf8] text-[#111a14] dark:bg-[#0a130e] dark:text-[#edf4ef] antialiased transition-colors duration-300 selection:bg-emerald-500/20 selection:text-emerald-500 dark:selection:text-emerald-400">
  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 w-full backdrop-blur-md bg-[#f7faf8]/85 dark:bg-[#0a130e]/85 border-b border-[#e2e8e4] dark:border-[#1a2f23] transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <!-- Brand -->
      <div class="flex items-center gap-3 select-none group">
        <div class="w-9 h-9 rounded-xl bg-emerald-100 dark:bg-[#1b4b39] border border-emerald-300 dark:border-[#2c7257] flex items-center justify-center text-emerald-700 dark:text-emerald-400 shadow-sm transition-transform duration-200 group-hover:-translate-y-0.5">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <span class="text-base sm:text-lg font-semibold tracking-tight text-[#111a14] dark:text-[#edf4ef]">
          RAG-Based AI Chatbot
        </span>
      </div>

      <!-- Actions (Chat Link & Theme Toggle) -->
      <div class="flex items-center gap-2.5">
        <a href="/chat" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-medium text-[#5e6f65] dark:text-[#889e92] hover:text-[#111a14] dark:hover:text-[#edf4ef] border border-[#e2e8e4] dark:border-[#1a2f23] hover:bg-[#e2e8e4]/50 dark:hover:bg-[#1a2f23]/60 transition-all duration-200">
          <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Chat</span>
        </a>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle" type="button" class="w-10 h-10 rounded-xl flex items-center justify-center text-[#5e6f65] dark:text-[#889e92] hover:text-[#111a14] dark:hover:text-[#edf4ef] border border-[#e2e8e4] dark:border-[#1a2f23] hover:bg-[#e2e8e4]/50 dark:hover:bg-[#1a2f23]/60 transition-all duration-200 hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-emerald-500/40 cursor-pointer" aria-label="Toggle color theme" title="Toggle color mode">
          <!-- Sun icon (shown in dark mode) -->
          <svg id="sun-icon" class="w-5 h-5 hidden dark:block transition-transform duration-300 rotate-0 hover:rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg id="moon-icon" class="w-5 h-5 block dark:hidden transition-transform duration-300 -rotate-12 hover:rotate-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Hero & Upload Container -->
  <main class="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-12 sm:py-16">
    <section class="w-full max-w-xl mx-auto flex flex-col items-center text-center">
      <!-- Title & Subtitle -->
      <div class="mb-8 sm:mb-10 space-y-3">
        <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl font-normal tracking-tight text-[#111a14] dark:text-[#edf4ef] leading-[1.15]">
          Ask your PDFs anything.
        </h1>
        <p class="text-sm sm:text-base font-normal text-[#5e6f65] dark:text-[#889e92]">
          Upload up to 3 PDFs, then chat with them.
        </p>
      </div>

      <!-- Drag & Drop Zone -->
      <div 
        id="drop-zone" 
        class="group w-full min-h-[200px] sm:min-h-[220px] rounded-2xl border-2 border-dashed border-[#b8d9c5] dark:border-[#223f2f] hover:border-emerald-600 dark:hover:border-emerald-400 bg-emerald-50/30 dark:bg-[#111e17]/60 hover:bg-emerald-100/40 dark:hover:bg-[#172a20]/75 flex flex-col items-center justify-center p-6 sm:p-8 cursor-pointer outline-none transition-all duration-300 ease-out select-none focus:border-emerald-600 dark:focus:border-emerald-400 focus:ring-4 focus:ring-emerald-500/10 hover:-translate-y-0.5 hover:shadow-lg dark:hover:shadow-[0_8px_30px_rgb(5,150,105,0.08)]" 
        tabindex="0" 
        role="button" 
        aria-label="File upload dropzone"
      >
        <input 
          type="file" 
          id="file-input" 
          accept="application/pdf,.pdf" 
          multiple 
          class="hidden" 
        />
        
        <div class="flex flex-col items-center pointer-events-none space-y-3 text-center">
          <div id="drop-zone-icon" class="w-12 h-12 rounded-2xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center transition-transform duration-300 group-hover:-translate-y-1 group-hover:scale-110 shadow-sm">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>

          <div>
            <p class="text-base sm:text-lg font-semibold tracking-tight text-[#111a14] dark:text-[#edf4ef]">
              Drop PDFs here or click to browse
            </p>
            <p class="text-xs sm:text-sm text-[#5e6f65] dark:text-[#889e92] mt-1 font-medium">
              PDF only &middot; <span id="selection-count" class="text-emerald-600 dark:text-emerald-400 font-semibold">0/3 selected</span>
            </p>
          </div>
        </div>
      </div>

      <!-- Selected Files Preview List -->
      <div id="file-list" class="w-full flex flex-col gap-2.5 mt-5" aria-live="polite"></div>

      <!-- Action Button -->
      <div class="mt-7 flex justify-center w-full">
        <button 
          id="upload-btn" 
          class="inline-flex items-center justify-center gap-2 px-7 py-3 min-w-[145px] h-12 rounded-xl text-sm font-semibold tracking-tight text-white dark:text-[#e8f9f0] bg-[#0f764e] dark:bg-[#1c523c] hover:bg-[#0b5c3c] dark:hover:bg-[#23674b] active:bg-[#08462d] dark:active:bg-[#174431] disabled:bg-[#cbdad1] dark:disabled:bg-[#14281e] disabled:text-[#7b8e83] dark:disabled:text-[#41594b] disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:transform-none disabled:shadow-none shadow-md shadow-emerald-950/10 hover:shadow-lg hover:shadow-emerald-950/20 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-500/50" 
          disabled
        >
          <svg id="upload-btn-icon" class="w-4 h-4 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span id="upload-btn-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" aria-hidden="true"></span>
          <span id="upload-btn-text">Upload</span>
        </button>
      </div>
    </section>
  </main>

  <!-- Toast Notification Container -->
  <div 
    id="toast" 
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 opacity-0 pointer-events-none max-w-[90vw] sm:max-w-md px-5 py-3 rounded-xl text-sm font-medium shadow-2xl flex items-center gap-3 z-50 transition-all duration-300 ease-out bg-[#1f2937] text-[#f9fafb] border border-white/10 dark:bg-[#16291e] dark:text-[#f0fdf4] dark:border-[#234633]" 
    role="alert" 
    aria-live="assertive"
  >
    <span id="toast-message"></span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
